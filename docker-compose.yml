services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: wms_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=warehouse_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wms_network

  web:
    image: nginx:alpine
    container_name: wms_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - wms_network

  postgres:
    image: postgres:17-alpine
    container_name: wms_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: warehouse_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d warehouse_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - wms_network

  redis:
    image: redis:alpine
    container_name: wms_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - wms_network

networks:
  wms_network:
    driver: bridge

volumes:
  pgdata:
    driver: local
